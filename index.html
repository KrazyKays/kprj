<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2ead9" />
    <title>KattaK</title>
  </head>
  <body>
    <main class="game-layout">
      <section class="arena-column" aria-labelledby="game-title">
        <header class="arena-header">
          <h1 id="game-title">KattaK<span>!</span></h1>
        </header>
        <div id="game" aria-label="Arène interactive"></div>
        <p class="arena-instructions"><strong>RÈGLE 01</strong> Cliquez ou touchez pour déplacer le joueur. Une ressource est ramassée dès que son bord touche le cercle rouge.</p>
      </section>

      <aside class="game-panel" aria-label="Ressources et actions">
        <section class="panel-card" aria-labelledby="resources-title">
          <h2 id="resources-title"><span>01</span> Butin</h2>
          <p class="resource-total">
            <output id="resource-count" aria-label="Ressources disponibles" aria-live="polite">0</output>
            <span>disponibles</span>
          </p>
          <p class="panel-placeholder">Ramassez les jetons dorés pour recruter des compagnons.</p>
        </section>
        <section class="panel-card" aria-labelledby="actions-title">
          <h2 id="actions-title"><span>02</span> Recrutement</h2>
          <button id="summon-button" class="summon-button" type="button" disabled>
            Invoquer tout
          </button>
          <p id="summon-preview" class="summon-preview" aria-live="polite"></p>
          <p id="summon-result" class="summon-result" role="status" aria-live="polite"></p>
          <ul id="companion-list" class="companion-list" aria-label="Compagnons"></ul>
          <p class="panel-placeholder">La partie s’efface au prochain rechargement.</p>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
